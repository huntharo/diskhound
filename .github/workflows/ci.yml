name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Default types are opened, synchronize, and reopened. Without
    # edited, renaming a "Cut DiskHound" pull request keeps the old
    # green changelog check on the same commit.
    types: [opened, synchronize, reopened, edited]
    branches: [main, master]

jobs:
  typecheck-and-test:
    # A body-only edit does not change the guard's answer. A title
    # edit does, so the whole job runs again.
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject feature-branch changelog edits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          bun run scripts/changelog-guard.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build (renderer + electron)
        run: bun run build

  # typecheck-and-test runs vitest on Linux. Some tests only do real
  # work on Windows (paths, delete errors) or depend on the local df.
  vitest-cross-os:
    if: github.event.action != 'edited' || github.event.changes.title
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  rust-check:
    if: github.event.action != 'edited' || github.event.changes.title
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path native/diskhound-native-scanner/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path native/diskhound-native-scanner/Cargo.toml
