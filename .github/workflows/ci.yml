name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Not edited. A run for a description edit would skip these jobs,
    # and the skipped checks would replace their last results on the
    # pull request. The changelog guard reads the title, so it runs on
    # edits from its own workflow, changelog-guard.yml. A base change is
    # an edit too: push or reopen to test against the new base.
    types: [opened, synchronize, reopened]
    branches: [main, master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build (renderer + electron)
        run: bun run build

  # typecheck-and-test runs vitest on Linux. Some tests only do real
  # work on Windows (paths, delete errors) or depend on the local df.
  vitest-cross-os:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is VS 18 (2026), which blake2's node-gyp 11 does
        # not recognize, so `bun install` fails. Same pin as release.yml.
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/diskhound-native-scanner

      - name: Cargo check
        run: cargo check --manifest-path native/diskhound-native-scanner/Cargo.toml

      # Before the release build, which is slow with LTO. Some tests are
      # OS-gated: the MFT and USN journal tests only build on Windows,
      # the mountinfo tests only on Linux.
      - name: Cargo test
        run: cargo test --manifest-path native/diskhound-native-scanner/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path native/diskhound-native-scanner/Cargo.toml
