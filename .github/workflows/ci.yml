name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject feature-branch changelog edits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          bun run scripts/changelog-guard.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build (renderer + electron)
        run: bun run build

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path native/diskhound-native-scanner/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path native/diskhound-native-scanner/Cargo.toml
