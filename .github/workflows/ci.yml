name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Default types are opened, synchronize, and reopened. Without
    # edited, renaming a "Cut DiskHound" pull request keeps the old
    # green changelog check on the same commit.
    types: [opened, synchronize, reopened, edited]
    branches: [main, master]

jobs:
  # Its own job, and it runs on every pull_request event, including a
  # body-only edit. Skipping it would post a successful skipped check
  # on the same commit and cover a failed title edit.
  changelog-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject feature-branch changelog edits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          # Run main's copy. The pull request checkout can replace this
          # script with one that always exits 0 and edit CHANGELOG.md.
          git show "$BASE_SHA:scripts/changelog-guard.mjs" > /tmp/changelog-guard.mjs
          node /tmp/changelog-guard.mjs

  typecheck-and-test:
    # A body-only edit does not change the build. A title edit does.
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build (renderer + electron)
        run: bun run build

  rust-check:
    if: github.event.action != 'edited' || github.event.changes.title
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path native/diskhound-native-scanner/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path native/diskhound-native-scanner/Cargo.toml
